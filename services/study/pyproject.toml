[project]
name = "lifeos-study-services"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "flask>=3.1,<4", "redis>=5,<7", "rq>=2.3,<3", "PyYAML>=6,<7", "markdown-it-py>=3,<5", "bleach>=6,<7"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
extend = "./ruff-base.toml"
line-length = 110

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["api", "publisher", "robot"]
