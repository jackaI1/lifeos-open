[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-lora-sft-eval"
version = "0.1.0"
description = "Train and compare small extraction adapters with held-out evidence"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "torch==2.9.0", "transformers==4.57.1", "datasets==4.3.0",
  "peft==0.17.1", "accelerate==1.11.0", "mlflow-skinny==3.5.1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
qlora = ["bitsandbytes==0.48.2"]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads and trains a real open-weight model"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
