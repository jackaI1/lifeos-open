name: LifeOSCompanion
options:
  bundleIdPrefix: ca.jacklai.lifeos
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  LifeOSCore:
    type: framework
    platform: iOS
    sources: [Sources/LifeOSCore]
  LifeOSCompanion:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: LifeOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.jacklai.lifeos.companion
        INFOPLIST_KEY_CFBundleDisplayName: LifeOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
  LifeOSCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LifeOSCoreTests
        excludes: [Fixtures]
      - path: Tests/LifeOSCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: LifeOSCore
schemes:
  LifeOSCompanion:
    build:
      targets:
        LifeOSCompanion: all
        LifeOSCoreTests: [test]
    test:
      targets: [LifeOSCoreTests]
      gatherCoverageData: true
