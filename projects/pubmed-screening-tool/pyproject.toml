[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-screening-tool"
version = "0.1.0"
description = "Reproducible PubMed searches and auditable title/abstract screening"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jack Lai"}]
dependencies = []

[project.scripts]
pubmed-screen = "pubmed_screening.__main__:main"

[tool.setuptools.packages.find]
include = ["pubmed_screening*"]
