[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-forecast"
version = "0.1.0"
description = "Past-only hourly weather forecasting benchmark"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sensor-forecast = "sensor_forecast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["text_models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Linux CI needs only the much smaller CPU build, not CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
