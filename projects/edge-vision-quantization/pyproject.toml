[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-vision-quantization"
version = "0.1.0"
description = "Reproducible PPE detector training and CPU INT8 measurements"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "ultralytics==8.3.221", "torch==2.8.0", "torchvision==0.23.0",
  "onnx==1.19.1", "onnxruntime==1.23.2", "numpy==2.2.6",
  "pillow==11.3.0", "pyyaml==6.0.3", "pycocotools==2.0.10",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]
[project.scripts]
edgevision = "edgevision.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/edgevision"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
