[project]
name = "experiment-analysis"
version = "0.1.0"
description = "Compare restaurant ordering changes with randomized and before-and-after designs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "statsmodels>=0.14.4,<0.15", "matplotlib>=3.9,<4",
]

[project.scripts]
experiment-analysis = "experiment_analysis.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
