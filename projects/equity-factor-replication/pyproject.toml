[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-factor-replication"
version = "0.1.0"
description = "Reproducible public-data momentum research"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "matplotlib==3.10.3", "pyparsing==3.2.3"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
momentum = "momentum.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
