# Cloud Run service for the public LifeOS demo. deploy.sh fills in the four placeholders below.
# The image is the public-demo target of the repository Dockerfile. Nothing secret is written here:
# the runtime setting comes from Secret Manager at deploy time.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SERVICE__
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PARENT_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: __PARENT_ORIGIN_SECRET__
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
            periodSeconds: 30
            timeoutSeconds: 5
