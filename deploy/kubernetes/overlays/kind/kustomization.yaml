apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/jackai1/lifeos-open
    newName: lifeos-open
    newTag: kind
patches:
  - target:
      kind: Deployment
      name: lifeos
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: PersistentVolumeClaim
      name: lifeos-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: standard
