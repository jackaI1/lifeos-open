apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lifeos
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - storage.yaml
configMapGenerator:
  - name: lifeos-config
    literals:
      - NODE_ENV=production
      - PORT=8787
      - APP_ORIGIN=http://127.0.0.1:8787
      - LIFEOS_BIND_HOST=0.0.0.0
      - LIFEOS_DATABASE=/data/workspace.sqlite
      - AUTH_MODE=demo
      - DEMO_SEED=true
      - LLM_MODE=mock
      - GOOGLE_MODE=local
