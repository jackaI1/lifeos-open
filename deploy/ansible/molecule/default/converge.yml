---
- name: Converge
  hosts: all
  become: true
  vars:
    # Install exactly the commit being tested, from the checkout mounted at /src.
    lifeos_repo_url: /src
    lifeos_version: "{{ lookup('ansible.builtin.pipe', 'git -C ' ~ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/../.. rev-parse HEAD') }}"
    lifeos_demo_seed: false
  post_tasks:
    # A marker in the data directory, created after the role has made it. Later runs must leave it exactly as it was.
    - name: Create a data marker (only written on the first run)
      ansible.builtin.copy:
        dest: /var/lib/lifeos/molecule-marker.txt
        content: "keep me\n"
        force: false
        owner: lifeos
        group: lifeos
        mode: "0600"
  roles:
    - role: lifeos
