---
# Molecule starts a disposable Ubuntu container with systemd, runs the role,
# runs it again to prove the second run changes nothing, then checks the service.
# It needs Docker, so it runs in GitHub Actions (.github/workflows/ansible-role.yml),
# not on a laptop without Docker.
driver:
  name: docker
platforms:
  - name: lifeos-ubuntu-2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The code under test, read-only, so the role clones this commit and not GitHub's main.
      - ${MOLECULE_PROJECT_DIRECTORY}/../..:/src:ro
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
