name: Bug
description: Something behaves differently from what is documented or expected.
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional data only.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria for the fix
      placeholder: |
        - [ ] The steps above no longer reproduce the problem
        - [ ] A regression test fails before the fix and passes after
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Blocks use or loses data", "Wrong behaviour with a workaround", "Cosmetic"]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node version, local or hosted.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Logs and screenshots attached here contain no credentials or personal records.
          required: true
