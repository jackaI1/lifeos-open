name: Feature (user story)
description: A user-visible improvement written as a story with acceptance criteria and an estimate.
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As a <who>, I want <what>, so that <why>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable, one per line, as a checklist. These are what the reviewer verifies.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Existing tests still pass and new tests cover the change
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      description: Relative size (see docs/process/working-agreement.md). Split anything larger than 8.
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["High", "Medium", "Low"]
      default: 1
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, dependencies and out of scope
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no credentials, personal records or private data.
          required: true
