name: quantum-maxcut-benchmark / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/quantum-maxcut-benchmark/**
    - .github/workflows/quantum-maxcut-benchmark-ci.yml
  pull_request:
    paths:
    - projects/quantum-maxcut-benchmark/**
    - .github/workflows/quantum-maxcut-benchmark-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install '.[test]'
    - run: pytest -q
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/quantum-maxcut-benchmark
