name: API and browser tests
on:
  pull_request:
    paths-ignore: ['projects/**']
  push:
    paths-ignore: ['projects/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  api:
    name: Postman collection with Newman
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: test-results/api/
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: Python Selenium checks in Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/selenium-python/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r test/selenium-python/requirements.txt
      - name: Run the browser checks against a disposable fictional workspace
        run: npm run test:selenium
        env:
          LIFEOS_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-reports
          path: test-results/selenium/
          if-no-files-found: ignore
          retention-days: 7
