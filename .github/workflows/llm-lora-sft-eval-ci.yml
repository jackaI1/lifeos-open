name: llm-lora-sft-eval / checks
on:
  push:
    branches:
    - main
    paths:
    - projects/llm-lora-sft-eval/**
    - .github/workflows/llm-lora-sft-eval-ci.yml
  pull_request:
    paths:
    - projects/llm-lora-sft-eval/**
    - .github/workflows/llm-lora-sft-eval-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: false
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.7
        enable-cache: true
        working-directory: projects/llm-lora-sft-eval
    - run: uv sync --python 3.11 --extra dev
    - run: uv run ruff check src tests
    - run: uv run ruff format --check src tests
    - run: uv run pytest -q
  real-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: false
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.7
        enable-cache: true
        working-directory: projects/llm-lora-sft-eval
    - run: uv sync --python 3.11 --extra dev --extra qlora
    - name: Real LoRA and NF4 QLoRA optimizer steps, saving and reloading
      run: uv run pytest -q -m integration
defaults:
  run:
    working-directory: projects/llm-lora-sft-eval
