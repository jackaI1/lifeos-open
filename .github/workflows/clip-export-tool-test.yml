name: clip-export-tool / Video checks
on:
  push:
    branches:
    - main
    paths:
    - projects/clip-export-tool/**
    - .github/workflows/clip-export-tool-test.yml
  pull_request:
    paths:
    - projects/clip-export-tool/**
    - .github/workflows/clip-export-tool-test.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: video-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install FFmpeg and caption font
      run: 'sudo apt-get update -qq

        sudo apt-get install -y ffmpeg fonts-dejavu-core

        '
    - name: Check real exports and catalogue
      run: python -m unittest discover -v
    - name: Run the included footage example
      run: 'python -m clip_export export examples/trami.mp4 examples/edits.json --captions examples/captions.srt --out exports/demo

        python -m clip_export catalogue import examples/trami.mp4 examples/edits.json --captions examples/captions.srt --db
        exports/footage.sqlite

        python -m clip_export catalogue search --db exports/footage.sqlite --tag storm

        python -m clip_export rough-cut --db exports/footage.sqlite --ids 2 1 --format square --output exports/rough-cut.mp4

        '
    - uses: actions/upload-artifact@v4
      if: matrix.python == '3.12'
      with:
        name: example-exports
        path: 'projects/clip-export-tool/exports/demo/*.mp4

          projects/clip-export-tool/exports/rough-cut.mp4'
        retention-days: 7
defaults:
  run:
    working-directory: projects/clip-export-tool
