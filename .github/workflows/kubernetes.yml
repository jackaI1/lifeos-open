name: Kubernetes
on:
  pull_request:
    paths-ignore: ['projects/**']
  push:
    paths-ignore: ['projects/**']
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manifests:
    name: Kustomize and kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.8
      - name: Install kubeconform 0.8.0 with release checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check --strict
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
      - run: npm run test:kubernetes
      - name: Check smoke script
        run: shellcheck deploy/kubernetes/smoke.sh
  kind:
    name: Published image on kind
    needs: manifests
    # Forks still render/validate and run the existing Docker build without write access.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jackai1/lifeos-open
      CLUSTER: lifeos-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select published tags
        id: tags
        env:
          IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          echo "tags=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$IS_MAIN" = true ]; then
            echo "tags=$IMAGE:sha-$GITHUB_SHA,$IMAGE:main" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish standalone image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/jackaI1/lifeos-open
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.8
      - name: Install kind 0.33.0 with release checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check --strict kind-linux-amd64.sha256sum
          sudo install kind-linux-amd64 /usr/local/bin/kind
      - name: Create disposable Kubernetes 1.35 cluster
        run: |
          kind create cluster --name "$CLUSTER" --wait 120s --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
      - name: Configure a temporary registry pull credential
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl --context "kind-$CLUSTER" create namespace lifeos
          kubectl --context "kind-$CLUSTER" -n lifeos create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io --docker-username="$GITHUB_ACTOR" --docker-password="$GHCR_TOKEN"
      - name: Deploy from registry and check health, persistence and rollback
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: bash deploy/kubernetes/smoke.sh "kind-$CLUSTER" "$IMAGE@$DIGEST"
      - name: Install Flux CLI
        uses: fluxcd/flux2/action@v2.7.5
      - name: Install Flux controllers and test Git reconciliation
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          flux --context "kind-$CLUSTER" install --timeout=5m
          bash deploy/flux/test.sh "kind-$CLUSTER" "$BRANCH" "$IMAGE@$DIGEST"
      - name: Bounded diagnostics on failure
        if: failure()
        run: |
          kubectl --context "kind-$CLUSTER" -n flux-system get gitrepositories,kustomizations -o yaml || true
          kubectl --context "kind-$CLUSTER" -n flux-system logs deployment/kustomize-controller --tail=40 || true
          kubectl --context "kind-$CLUSTER" -n lifeos get pods,pvc,deployments || true
          kubectl --context "kind-$CLUSTER" -n lifeos get events --sort-by=.lastTimestamp | tail -25 || true
          kubectl --context "kind-$CLUSTER" -n lifeos logs deployment/lifeos --tail=30 || true
      - name: Delete owned cluster and verify removal
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER"
          ! kind get clusters 2>/dev/null | grep -Fx "$CLUSTER"
          test -z "$(docker ps -aq --filter label=io.x-k8s.kind.cluster=$CLUSTER)"
