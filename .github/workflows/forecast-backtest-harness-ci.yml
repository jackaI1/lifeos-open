name: forecast-backtest-harness / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/forecast-backtest-harness/**
    - .github/workflows/forecast-backtest-harness-ci.yml
  pull_request:
    paths:
    - projects/forecast-backtest-harness/**
    - .github/workflows/forecast-backtest-harness-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m pytest -q
    - run: python -m forecast_harness
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/forecast-backtest-harness
