name: raytrace-trace-analyzer / Build and verify
on:
  push:
    branches:
    - main
    paths:
    - projects/raytrace-trace-analyzer/**
    - .github/workflows/raytrace-trace-analyzer-ci.yml
  pull_request:
    paths:
    - projects/raytrace-trace-analyzer/**
    - .github/workflows/raytrace-trace-analyzer-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.sanitizers }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          sanitizers: OFF
        - os: ubuntu-latest
          sanitizers: ON
        - os: macos-latest
          sanitizers: OFF
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: python -m pip install -r requirements.txt
    - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=${{ matrix.sanitizers }} -DPython3_EXECUTABLE=$(which
        python)
    - run: cmake --build build --parallel 2
    - run: ctest --test-dir build --output-on-failure
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: halt_on_error=1
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/raytrace-trace-analyzer
