name: llm-lora-sft-eval / serving and tracking
on:
  push:
    branches:
    - main
    paths:
    - projects/llm-lora-sft-eval/**
    - .github/workflows/llm-lora-sft-eval-serving.yml
  pull_request:
    paths:
    - projects/llm-lora-sft-eval/**
    - .github/workflows/llm-lora-sft-eval-serving.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  serving:
    strategy:
      fail-fast: false
      matrix:
        backend:
        - transformers
        - vllm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: false
      OMP_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.7
        enable-cache: true
        working-directory: projects/llm-lora-sft-eval
    - run: uv sync --python 3.11 --extra dev
    - name: Train, merge, serve both models and query MLflow
      env:
        TRAIN_STEPS: ${{ inputs.steps || '2' }}
        TRAIN_ROWS: ${{ inputs.train_rows || '8' }}
        TEST_ROWS: ${{ inputs.test_rows || '4' }}
        OUTPUT_TOKENS: ${{ inputs.max_tokens || '16' }}
      run: uv run python scripts/smoke_serving.py --backend ${{ matrix.backend }} --output runs/serving-${{ matrix.backend
        }} --steps "$TRAIN_STEPS" --train "$TRAIN_ROWS" --test "$TEST_ROWS" --max-tokens "$OUTPUT_TOKENS"
    - name: Verify no owned containers survive
      if: always()
      run: "owned=$(docker ps -aq --filter label=owner=llm-eval)\nif [ -n \"$owned\" ]; then\n  docker stop $owned\n  exit\
        \ 1\nfi\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: serving-${{ matrix.backend }}
        path: 'projects/llm-lora-sft-eval/runs/serving-${{ matrix.backend }}/comparison

          projects/llm-lora-sft-eval/runs/serving-${{ matrix.backend }}/evaluation

          projects/llm-lora-sft-eval/runs/serving-${{ matrix.backend }}/base

          projects/llm-lora-sft-eval/runs/serving-${{ matrix.backend }}/merged

          projects/llm-lora-sft-eval/runs/serving-${{ matrix.backend }}/mlruns

          projects/llm-lora-sft-eval/runs/serving-${{ matrix.backend }}/export/export.json'
        retention-days: 14
defaults:
  run:
    working-directory: projects/llm-lora-sft-eval
