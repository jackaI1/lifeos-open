name: rails-course-progress / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/rails-course-progress/**
    - .github/workflows/rails-course-progress-ci.yml
  pull_request:
    paths:
    - projects/rails-course-progress/**
    - .github/workflows/rails-course-progress-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/course_progress_test
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true
    - run: bundle exec rails db:prepare
    - run: bundle exec rspec
    - run: bundle exec rubocop
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/rails-course-progress
