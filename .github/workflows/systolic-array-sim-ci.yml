name: systolic-array-sim / Tests and checked examples
on:
  push:
    branches:
    - main
    paths:
    - projects/systolic-array-sim/**
    - .github/workflows/systolic-array-sim-ci.yml
  pull_request:
    paths:
    - projects/systolic-array-sim/**
    - .github/workflows/systolic-array-sim-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.10'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - run: python -m pip install -e '.[test]'
    - run: python -m pytest -q -W error
    - run: python -m systolic_array demo --trace
    - run: python -m systolic_array sweep --verify --json > checked-sweep.json
    - uses: actions/upload-artifact@v4
      with:
        name: checked-sweep-python-${{ matrix.python }}
        path: projects/systolic-array-sim/checked-sweep.json
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/systolic-array-sim
