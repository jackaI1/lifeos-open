name: Optional Azure browser demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile both deployment templates
        run: az bicep build --file infra/azure-demo/main.bicep --outfile /tmp/azure-demo.json
      - name: Check compiled ingress, identity, registry and scaling
        run: python3 tools/check-azure-demo.py /tmp/azure-demo.json
      - run: docker compose -f compose.study.yaml config --quiet
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/aws-static/template.yaml
        env:
          AWS_DEFAULT_REGION: us-east-1
  what-if:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.AZURE_DEMO_CLIENT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEMO_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEMO_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_DEMO_SUBSCRIPTION_ID }}
      - run: az deployment sub what-if --location canadacentral --template-file infra/azure-demo/main.bicep --parameters resourceGroupName=lifeos-public-study prefix=lifeosdemo
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEMO_CLIENT_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: azure-public-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEMO_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_DEMO_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_DEMO_SUBSCRIPTION_ID }}
      - name: Provision registry, logs, environment and pull identity
        run: az deployment sub create --name lifeos-public-foundation --location canadacentral --template-file infra/azure-demo/main.bicep --parameters deployApp=false --output json > /tmp/foundation.json
      - name: Build only the public browser image
        run: |
          registry=$(python3 -c "import json;print(json.load(open('/tmp/foundation.json'))['properties']['outputs']['registryName']['value'])")
          az acr build --registry "$registry" --image "lifeos-public:$GITHUB_SHA" --target public-demo .
      - name: Deploy revision with managed identity image pull
        run: az deployment sub create --name lifeos-public-release --location canadacentral --template-file infra/azure-demo/main.bicep --parameters deployApp=true imageTag="$GITHUB_SHA" --output json > /tmp/release.json
      - name: Check the public health endpoint
        run: |
          url=$(python3 -c "import json;print(json.load(open('/tmp/release.json'))['properties']['outputs']['demoUrl']['value'])")
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "$url/healthz"
