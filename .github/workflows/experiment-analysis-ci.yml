name: experiment-analysis / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/experiment-analysis/**
    - .github/workflows/experiment-analysis-ci.yml
  pull_request:
    paths:
    - projects/experiment-analysis/**
    - .github/workflows/experiment-analysis-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python }}
        enable-cache: true
        working-directory: projects/experiment-analysis
    - run: uv sync --locked
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run pytest -q
    - run: uv run experiment-analysis demo --output artifacts/demo
    - uses: actions/upload-artifact@v4
      with:
        name: demo-python-${{ matrix.python }}
        path: 'projects/experiment-analysis/artifacts/demo/report.md

          projects/experiment-analysis/artifacts/demo/results.json

          projects/experiment-analysis/artifacts/demo/event-study.png

          projects/experiment-analysis/artifacts/demo/truth.json'
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/experiment-analysis
