name: lifeos-android / Android
on:
  push:
    branches:
    - main
    paths:
    - projects/lifeos-android/**
    - .github/workflows/lifeos-android-android.yml
  pull_request:
    paths:
    - projects/lifeos-android/**
    - .github/workflows/lifeos-android-android.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-and-unit-results
        path: 'projects/lifeos-android/core/build/reports/tests/

          projects/lifeos-android/app/build/reports/

          projects/lifeos-android/app/build/outputs/apk/debug/'
  compose-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
    - name: Enable emulator acceleration
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_2
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: ./gradlew :app:connectedDebugAndroidTest
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: device-test-results
        path: 'projects/lifeos-android/app/build/reports/androidTests/

          projects/lifeos-android/app/build/outputs/androidTest-results/'
defaults:
  run:
    working-directory: projects/lifeos-android
