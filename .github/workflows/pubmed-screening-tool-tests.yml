name: pubmed-screening-tool / Offline tests
on:
  push:
    branches:
    - main
    paths:
    - projects/pubmed-screening-tool/**
    - .github/workflows/pubmed-screening-tool-tests.yml
  pull_request:
    paths:
    - projects/pubmed-screening-tool/**
    - .github/workflows/pubmed-screening-tool-tests.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.10'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install .
    - name: Run the complete offline test suite
      run: python -m unittest discover -s tests -v
    - name: Replay the worked medication-device example
      run: python examples/worked_example.py --out "$RUNNER_TEMP/pubmed-example"
    - name: Verify the installed command outside the source directory
      working-directory: projects/pubmed-screening-tool/${{ runner.temp }}
      run: pubmed-screen --help
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/pubmed-screening-tool
