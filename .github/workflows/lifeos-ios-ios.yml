name: lifeos-ios / iOS
on:
  push:
    branches:
    - main
    paths:
    - projects/lifeos-ios/**
    - .github/workflows/lifeos-ios-ios.yml
  pull_request:
    paths:
    - projects/lifeos-ios/**
    - .github/workflows/lifeos-ios-ios.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Run package XCTest suite
      run: swift test --jobs 2
    - name: Read public feed and verify offline relaunch
      env:
        FEED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      run: swift run --jobs 2 LifeOSDemoCheck "https://raw.githubusercontent.com/jackaI1/lifeos-ios/$FEED_COMMIT/demo-api/today.json"
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Run iOS XCTest and build the app
      run: scripts/ci-ios.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-test-results
        path: projects/lifeos-ios/TestResults.xcresult
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: companion-screen
        path: projects/lifeos-ios/Companion.png
        if-no-files-found: ignore
defaults:
  run:
    working-directory: projects/lifeos-ios
