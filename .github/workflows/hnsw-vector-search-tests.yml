name: hnsw-vector-search / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/hnsw-vector-search/**
    - .github/workflows/hnsw-vector-search-tests.yml
  pull_request:
    paths:
    - projects/hnsw-vector-search/**
    - .github/workflows/hnsw-vector-search-tests.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m unittest discover -s tests -v
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/hnsw-vector-search
