name: llm-lora-sft-eval / held-out benchmark
on:
  push:
    branches:
    - main
    paths:
    - projects/llm-lora-sft-eval/**
    - .github/workflows/llm-lora-sft-eval-benchmark.yml
  pull_request:
    paths:
    - projects/llm-lora-sft-eval/**
    - .github/workflows/llm-lora-sft-eval-benchmark.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: false
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.9.7
        enable-cache: true
        working-directory: projects/llm-lora-sft-eval
    - run: uv sync --python 3.11 --extra qlora
    - name: Prepare both configs and the common data
      env:
        STEPS: ${{ inputs.steps || '80' }}
      run: "uv run llm-eval prepare --train 128 --validation 16 --test 32\nuv run python - <<'PY'\nimport json, os\nfrom pathlib\
        \ import Path\nsteps = int(os.environ['STEPS'])\nif not 1 <= steps <= 500:\n    raise ValueError('steps must be 1..500')\n\
        for mode in ('lora', 'qlora'):\n    config = json.loads(Path(f'configs/cpu-{mode}.json').read_text())\n    config['steps']\
        \ = steps\n    Path(f'runs-{mode}.json').write_text(json.dumps(config))\nPY\n"
    - run: uv run llm-eval train --config runs-lora.json --output runs/lora
    - run: uv run llm-eval train --config runs-qlora.json --output runs/qlora
    - run: uv run llm-eval evaluate --adapters runs/lora runs/qlora --output runs/comparison
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: held-out-evidence
        path: 'projects/llm-lora-sft-eval/data/intake

          projects/llm-lora-sft-eval/runs/lora/adapter

          projects/llm-lora-sft-eval/runs/lora/run.json

          projects/llm-lora-sft-eval/runs/qlora/adapter

          projects/llm-lora-sft-eval/runs/qlora/run.json

          projects/llm-lora-sft-eval/runs/comparison

          projects/llm-lora-sft-eval/runs/mlruns'
        retention-days: 14
defaults:
  run:
    working-directory: projects/llm-lora-sft-eval
