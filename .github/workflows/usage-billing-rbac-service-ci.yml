name: usage-billing-rbac-service / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/usage-billing-rbac-service/**
    - .github/workflows/usage-billing-rbac-service-ci.yml
  pull_request:
    paths:
    - projects/usage-billing-rbac-service/**
    - .github/workflows/usage-billing-rbac-service-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m unittest discover -s tests -v
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/usage-billing-rbac-service
