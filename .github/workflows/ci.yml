name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: fictional-ci-password
          POSTGRES_DB: lifeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Replay fictional usage through the exported analytics configuration
        run: npm run analytics:check
      - name: Verify committed React bundle matches its source
        run: test -z "$(git status --porcelain -- public/react)" || { git status --short -- public/react; exit 1; }
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://lifeos:fictional-ci-password@127.0.0.1:5432/lifeos_test' || '' }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run privacy
      - run: npx playwright install --with-deps chromium
      - run: node --test tools/analytics-browser.test.mjs
      - run: npm run test:smoke
      - name: Verify clock preference and lecture lifecycle
        run: npm run test:e2e
        env:
          E2E_FOCUS: '^(25|26|27)-|^time-format'
  whisper:
    name: Real offline Whisper public-clip test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/whisper/requirements.lock
      - run: npm ci
      - run: python -m pip install --require-hashes -r tools/whisper/requirements.lock
      - name: Download public model weights (setup only)
        run: python tools/whisper/transcribe.py --model tiny.en --download-only
      - name: Recognize the fixture through the offline worker
        run: npm run test:whisper
        env:
          WHISPER_PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-public-clip-evaluation
          path: .runtime/whisper/evaluation.json
          retention-days: 7
