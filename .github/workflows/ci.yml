name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run privacy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Verify lecture mount and slide suspension races
        run: npm run test:e2e
        env:
          E2E_FOCUS: '^(25|26)-'
