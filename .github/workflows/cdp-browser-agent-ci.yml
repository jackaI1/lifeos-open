name: cdp-browser-agent / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/cdp-browser-agent/**
    - .github/workflows/cdp-browser-agent-ci.yml
  pull_request:
    paths:
    - projects/cdp-browser-agent/**
    - .github/workflows/cdp-browser-agent-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: projects/cdp-browser-agent/package-lock.json
    - run: npm ci
    - run: npm run build
    - run: npm test
      env:
        CHROME_PATH: /usr/bin/google-chrome
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/cdp-browser-agent
