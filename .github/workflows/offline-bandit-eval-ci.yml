name: offline-bandit-eval / Tests
on:
  push:
    branches:
    - main
    paths:
    - projects/offline-bandit-eval/**
    - .github/workflows/offline-bandit-eval-ci.yml
  pull_request:
    paths:
    - projects/offline-bandit-eval/**
    - .github/workflows/offline-bandit-eval-ci.yml
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.9'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install '.[test]'
    - run: python -m pytest -q
    - run: python -m bandit --rows 2000 --bootstrap 30
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/offline-bandit-eval
