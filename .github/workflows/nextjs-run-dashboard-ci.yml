name: nextjs-run-dashboard / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/nextjs-run-dashboard/**
    - .github/workflows/nextjs-run-dashboard-ci.yml
  pull_request:
    paths:
    - projects/nextjs-run-dashboard/**
    - .github/workflows/nextjs-run-dashboard-ci.yml
  workflow_dispatch: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: run_dashboard
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/run_dashboard
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: projects/nextjs-run-dashboard/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run db:seed
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    timeout-minutes: 20
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/nextjs-run-dashboard
