name: equity-factor-replication / Research checks
on:
  push:
    branches:
    - main
    paths:
    - projects/equity-factor-replication/**
    - .github/workflows/equity-factor-replication-research.yml
  pull_request:
    paths:
    - projects/equity-factor-replication/**
    - .github/workflows/equity-factor-replication-research.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.12.19
        working-directory: projects/equity-factor-replication
    - run: uv sync --locked --python ${{ matrix.python }}
    - run: uv run ruff check .
    - run: uv run pytest -q
    - run: uv run momentum --check
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/equity-factor-replication
