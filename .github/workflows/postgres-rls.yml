name: PostgreSQL row-level security
on:
  push:
    paths:
      - src/storage/**
      - src/local/service.ts
      - test/postgres-rls.integration.mjs
      - .github/workflows/postgres-rls.yml
  pull_request:
    paths:
      - src/storage/**
      - src/local/service.ts
      - test/postgres-rls.integration.mjs
      - .github/workflows/postgres-rls.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rls:
    name: Cross-workspace reads and writes are blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: fictional-ci-password
          POSTGRES_DB: lifeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run the row-level security tests against the PostgreSQL service
        run: node --test test/postgres-rls.integration.mjs
        env:
          TEST_DATABASE_URL: postgresql://lifeos:fictional-ci-password@127.0.0.1:5432/lifeos_test
