services:
  budibase:
    image: budibase/budibase:v3.50.0
    ports: ['127.0.0.1:10000:80']
    environment:
      LITELLM_READY_TIMEOUT_SECONDS: '5'
      LITELLM_DB_READY_TIMEOUT_SECONDS: '10'
      JWT_SECRET: ${BUDIBASE_JWT_SECRET:?Set a random local secret}
      INTERNAL_API_KEY: ${BUDIBASE_INTERNAL_KEY:?Set a random local key}
      API_ENCRYPTION_KEY: ${BUDIBASE_ENCRYPTION_KEY:?Set a random local key}
      ENCRYPTION_KEY: ${BUDIBASE_ENCRYPTION_KEY:?Set a random local key}
      REDIS_PASSWORD: ${BUDIBASE_REDIS_PASSWORD:?Set a random local password}
    volumes: [budibase-data:/data, ./tools/internal-desk/diagnose.mjs:/opt/lifeos-diagnose.mjs:ro]
volumes:
  budibase-data:
