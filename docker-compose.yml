# docker compose up --build            -> LifeOS at http://127.0.0.1:8787
# PostgreSQL: set DATABASE_URL, start postgres with --wait, then lifeos (docs/postgresql.md).
#
# The app's SQLite database lives in the named volume `lifeos-data` (mounted at /data),
# so records survive `docker compose down`. `docker compose down -v` deletes them.
name: lifeos-open

services:
  lifeos:
    build:
      context: .
      target: runtime
    image: ghcr.io/jackai1/lifeos-open:${LIFEOS_IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      AUTH_MODE: ${AUTH_MODE:-demo}
      DEMO_SEED: ${DEMO_SEED:-true}
      LLM_MODE: ${LLM_MODE:-mock}
      LOCAL_ACCESS_TOKEN: ${LOCAL_ACCESS_TOKEN:-}
    ports:
      # Host and container port must match: the server rejects requests whose Host
      # header differs from its loopback origin. Published on loopback only.
      - "127.0.0.1:8787:8787"
    volumes:
      - lifeos-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional disposable cache. Enable with --profile redis and set REDIS_URL.
  redis:
    profiles: ["redis"]
    image: redis:7.4-alpine
    user: redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional self-hosted database. DATABASE_URL selects it for the app.
  # Reachable inside the compose network as postgres:5432 and never published.
  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      # Development-only default; override with POSTGRES_PASSWORD in your shell or .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeos-dev-only}
    volumes:
      - lifeos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lifeos-data:
  lifeos-pg:
